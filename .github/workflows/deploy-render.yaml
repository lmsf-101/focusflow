name: Deploy Render
on:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    environment: production
    env:
      BACKEND_URL: ${{ vars.RENDER_URL }}
    steps:
      - name: Wait for the new version to be available in Render
        timeout-minutes: 8
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is not defined. Please add the URL variable within the production environment"
            exit 1
          fi
          POLL_INTERVAL=10
          echo "Starting health check for $BACKEND_URL ..."
          while true; do
            if RESPONSE=$(curl -s -f --max-time 60 "$BACKEND_URL/health"); then
              if RENDER_COMMIT=$(echo "$RESPONSE" | jq -r -e '.render_git_commit'); then
                if [[ $RENDER_COMMIT == "$GITHUB_SHA" ]]; then
                  echo "Success! The new version is available in Render"
                  exit 0
                else
                  echo "Render is not synced with the new version. Retrying in $POLL_INTERVAL seconds..."
                fi
              else
                echo "Render does not contain GIT_COMMIT data. Retrying in $POLL_INTERVAL seconds..."
              fi
            else
              echo "Curl to backend failed. Retrying in $POLL_INTERVAL seconds..."
            fi
            sleep $POLL_INTERVAL
          done
      - name: Run smoke-test with protected routes
        env:
          TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          if TOKEN_RESPONSE=$(curl -X POST -s -f --max-time 60 "$BACKEND_URL"/token \
            --data-urlencode "username=$TEST_EMAIL" \
            --data-urlencode "password=$TEST_PASSWORD" \
            --data-urlencode "grant_type=password"); then
            if TOKEN=$(echo "$TOKEN_RESPONSE" | jq -e -r '.access_token'); then
              if USER_RESPONSE=$(curl -s -f --max-time 15 "$BACKEND_URL"/users/me \
                                  -H "Authorization: Bearer $TOKEN"); then
                if BODY_EMAIL_ATTR=$(echo "$USER_RESPONSE" | jq -r '.email'); then

                  if [[ "$BODY_EMAIL_ATTR" == "$TEST_EMAIL" ]]; then
                    echo "Smoke test completed! Managed to access app with token"
                    exit 0
                  else
                    echo "Smoke test failed. Retrieved email does not correspond with the test email"
                    exit 1
                  fi
                else
                  echo "Smoke test failed. Email attribute was not found"
                fi
              else
                echo "Smoke test failed when trying to access user's details"
                exit 1
              fi
            else
              echo "Smoke test failed. Access token was not found"
              exit 1
            fi
          else
            echo "Smoke test failed when trying to retrieve token in $BACKEND_URL"
            exit 1
          fi
